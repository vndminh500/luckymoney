<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#30AFFF" />
    <title>Không có kết nối · Lucky Money</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3faff;
        --text: #062b45;
        --muted: #4d6b80;
        --surface: #ffffff;
        --border: #d6ebf7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #071c2b;
          --text: #eaf4f3;
          --muted: #9fb8c8;
          --surface: #0d2a3e;
          --border: #1d4560;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font-family:
          Roboto,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 360px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 32px 24px;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        font-size: 1.4rem;
        margin: 16px 0 8px;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 24px;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 48px;
        padding: 0 24px;
        border-radius: 12px;
        background: #30afff;
        color: #062b45;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #0a6aa8;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Không có kết nối mạng</h1>
      <p>
        Lucky Money cần Internet để tải dữ liệu của bạn. Hãy kiểm tra Wi-Fi hoặc 4G rồi thử lại.
      </p>
      <a href="/">Thử lại</a>
    </main>
  </body>
</html>
