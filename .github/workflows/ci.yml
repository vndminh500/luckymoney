name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Test-only values. Each suite migrates its own database before running.
env:
  DATABASE_URL: postgresql://spendly:spendly@localhost:5432/spendly?schema=public
  TEST_DATABASE_URL: postgresql://spendly:spendly@localhost:5432/spendly_test?schema=public
  E2E_DATABASE_URL: postgresql://spendly:spendly@localhost:5432/spendly_e2e?schema=public
  AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
  AUTH_TRUST_HOST: "true"

jobs:
  check:
    name: Lint, typecheck, unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spendly
          POSTGRES_PASSWORD: spendly
          POSTGRES_DB: spendly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spendly" --health-interval 2s --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

  e2e:
    name: E2E test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spendly
          POSTGRES_PASSWORD: spendly
          POSTGRES_DB: spendly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spendly" --health-interval 2s --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
