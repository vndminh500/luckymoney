# Local PostgreSQL for development. Start with: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spendly
      POSTGRES_PASSWORD: spendly
      POSTGRES_DB: spendly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendly -d spendly"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
